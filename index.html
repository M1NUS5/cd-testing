<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tests de CD - M1NUS5</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mocha/10.2.0/mocha.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            border-bottom: 4px solid #667eea;
            padding-bottom: 15px;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .header-info {
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            padding: 20px;
            border-left: 5px solid #667eea;
            margin-bottom: 30px;
            border-radius: 8px;
        }
        .header-info p {
            margin: 8px 0;
            color: #666;
            font-size: 1.1em;
        }
        .header-info strong {
            color: #333;
        }
        #mocha {
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Tests de Despliegue Continuo (CD)</h1>
        <div class="header-info">
            <p><strong>📦 Proyecto:</strong> M1NUS5/cd-testing</p>
            <p><strong>🌿 Rama:</strong> main</p>
            <p><strong>📝 Versión:</strong> 1.0 - Modificado</p>
            <p><strong>⏱️ Estado:</strong> Ejecutando tests...</p>
        </div>
        
        <div id="mocha"></div>
        
        <script src="https://cdnjs.cloudflare.com/ajax/libs/mocha/10.2.0/mocha.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/chai/4.3.7/chai.min.js"></script>
        
        <script>
            mocha.setup('bdd');
            const { expect } = chai;

            // Test 1: Operaciones Matemáticas
            describe('Operaciones Matemáticas', function() {
                it('debe sumar 2 + 2 correctamente', function() {
                    expect(2 + 2).to.equal(4);
                });

                it('debe restar 5 - 3 correctamente', function() {
                    expect(5 - 3).to.equal(2);
                });

                it('debe multiplicar 3 * 3 y obtener 10', function() {
                    expect(3 * 3).to.equal(10); // Esto va a fallar - debería ser 9
                });

                it('debe dividir 10 / 2 correctamente', function() {
                    expect(10 / 2).to.equal(5);
                });
            });

            // Test 2: Validaciones de Strings
            describe('Validaciones de Strings', function() {
                it('debe validar que "hello" contiene "ell"', function() {
                    expect('hello').to.include('ell');
                });

                it('debe validar la longitud de una cadena', function() {
                    expect('GitHub').to.have.lengthOf(6);
                });

                it('debe validar que "test" es una cadena', function() {
                    expect('test').to.be.a('string');
                });

                it('debe validar que "CD" está en mayúsculas', function() {
                    expect('CD').to.equal('CD'.toUpperCase());
                });
            });

            // Test 3: Validaciones de Arrays
            describe('Validaciones de Arrays', function() {
                it('debe validar que un array contiene un elemento', function() {
                    expect([1, 2, 3]).to.include(2);
                });

                it('debe validar la longitud de un array', function() {
                    expect([1, 2, 3, 4]).to.have.lengthOf(4);
                });

                it('debe validar que un array es un array', function() {
                    expect([]).to.be.an('array');
                });
            });

            // Test 4: Validaciones de Números
            describe('Validaciones de Números', function() {
                it('debe validar que 5 es mayor que 3', function() {
                    expect(5).to.be.greaterThan(3);
                });

                it('debe validar que 10 es un número', function() {
                    expect(10).to.be.a('number');
                });
            });

            mocha.run();
        </script>
    </div>
</body>
</html>
